[phases.setup]
aptPkgs = ['libpng-dev', 'libjpeg62-turbo-dev', 'libfreetype6-dev', 'libzip-dev', 'libpq-dev', 'libicu-dev']

[phases.install]
cmds = ['install-php-extensions gd zip bcmath intl pdo_pgsql', 'composer install --no-dev --optimize-autoloader --no-scripts --no-interaction']

[start]
cmd = 'php artisan migrate --force && php artisan config:cache && php artisan route:cache && php artisan serve --host=0.0.0.0 --port=${PORT:-8080}'
