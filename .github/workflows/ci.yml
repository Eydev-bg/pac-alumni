name: CI

# ---------------------------------------------------------------------------
# Continuous Integration for the PAC Alumni Tracking System.
#
# This pipeline BUILDS and TESTS the code only. It performs NO deployment:
# no server/VPS, no cloud platform, no Docker publishing, no FTP.
#
# Two independent jobs run in parallel:
#   * backend  -> Laravel 12 / PHP 8.2 API  (working-directory: backend)
#   * frontend -> React + Vite build        (working-directory: frontend)
# ---------------------------------------------------------------------------

# 1. TRIGGERS: run on every push to main and every pull request targeting main.
on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

# Least-privilege: CI only needs to read the repository contents.
permissions:
  contents: read

# Cancel an in-progress run for the same branch/PR when a newer commit arrives,
# so we don't waste minutes on stale commits.
concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  # =========================================================================
  # BACKEND JOB — Laravel 12 REST API (PHP 8.2)
  # =========================================================================
  backend:
    name: Backend (Laravel / PHP 8.2)
    runs-on: ubuntu-latest

    # Every "run" step in this job executes inside the backend/ folder,
    # where composer.json lives.
    defaults:
      run:
        working-directory: backend

    steps:
      # 1. Check out the repository so the runner has the source code.
      - name: Checkout repository
        uses: actions/checkout@v4

      # 2. Install PHP 8.2 with the extensions Laravel + our packages need.
      #    - pdo_sqlite / sqlite3 : required for the SQLite in-memory test DB
      #    - gd, zip, dom, xml    : required by dompdf and maatwebsite/excel
      #    - mbstring, bcmath,    : Laravel framework essentials
      #      fileinfo, curl, intl
      #    coverage: none keeps the run fast (we don't collect code coverage).
      - name: Setup PHP
        uses: shivammathur/setup-php@v2
        with:
          php-version: "8.2"
          extensions: mbstring, dom, xml, bcmath, gd, zip, pdo_sqlite, sqlite3, fileinfo, curl, intl
          coverage: none
          tools: composer:v2

      # 3. Validate composer.json (and that composer.lock is in sync).
      #    Runs BEFORE install so a malformed manifest fails fast.
      #    --no-check-publish skips warnings that only matter for packages
      #    published to Packagist (this is an application, not a library).
      - name: Validate composer.json
        run: composer validate --strict --no-check-publish

      # 4. Cache the Composer download cache, keyed on composer.lock.
      #    A matching key restores instantly; a miss falls back to the newest
      #    partial cache, then saves a fresh one at the end of the job.
      - name: Get Composer cache directory
        id: composer-cache
        run: echo "dir=$(composer config cache-files-dir)" >> "$GITHUB_OUTPUT"

      - name: Cache Composer dependencies
        uses: actions/cache@v4
        with:
          path: ${{ steps.composer-cache.outputs.dir }}
          key: ${{ runner.os }}-composer-${{ hashFiles('backend/composer.lock') }}
          restore-keys: |
            ${{ runner.os }}-composer-

      # 5. Install PHP dependencies.
      #    Dev dependencies are INCLUDED on purpose — PHPUnit lives in
      #    require-dev and is needed to run the test suite.
      - name: Install Composer dependencies
        run: composer install --prefer-dist --no-interaction --no-progress --optimize-autoloader

      # 6. Create the .env file the framework reads at runtime.
      - name: Copy .env.example to .env
        run: cp .env.example .env

      # 7. Generate the Laravel application encryption key (APP_KEY).
      - name: Generate application key
        run: php artisan key:generate

      # 8. Generate the JWT signing secret.
      #    REQUIRED: several feature tests call JWTAuth::fromUser(), which
      #    throws "Secret is not set" if JWT_SECRET is empty. .env.example
      #    ships it blank, so we mint an ephemeral one for this CI run.
      - name: Generate JWT secret
        run: php artisan jwt:secret --force

      # 9. PHP syntax check (lint) across the whole app/ directory.
      #    php -l parses each file; -P4 lints four files in parallel.
      #    Any parse error fails the job immediately.
      - name: PHP syntax check (php -l on app/)
        run: find app -name '*.php' -print0 | xargs -0 -n1 -P4 php -l

      # 10. Validate that all migrations apply cleanly from an empty database.
      #     Uses a throwaway file-based SQLite DB for an isolated "from zero"
      #     signal. (The test suite itself uses an in-memory DB via phpunit.xml,
      #     so this step does not affect step 11.)
      - name: Run database migrations
        env:
          DB_CONNECTION: sqlite
          DB_DATABASE: ${{ github.workspace }}/backend/database/ci.sqlite
        run: |
          touch "${{ github.workspace }}/backend/database/ci.sqlite"
          php artisan migrate --force

      # 11. Run the backend test suite.
      #     phpunit.xml pins APP_ENV=testing and an in-memory SQLite database,
      #     and the DB-backed tests use the RefreshDatabase trait, so the
      #     schema is rebuilt in-memory automatically.
      - name: Run backend tests
        run: php artisan test

  # =========================================================================
  # FRONTEND JOB — React + Vite production build
  # =========================================================================
  frontend:
    name: Frontend (React / Vite build)
    runs-on: ubuntu-latest

    # Every "run" step in this job executes inside the frontend/ folder,
    # where package.json lives.
    defaults:
      run:
        working-directory: frontend

    steps:
      # 1. Check out the repository source.
      - name: Checkout repository
        uses: actions/checkout@v4

      # 2. Install Node.js LTS (20) and enable built-in npm dependency caching.
      #    cache-dependency-path points setup-node at the frontend lockfile so
      #    the cache key tracks the correct package-lock.json.
      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: "npm"
          cache-dependency-path: frontend/package-lock.json

      # 3. Install exactly what the lockfile specifies (clean, reproducible).
      - name: Install npm dependencies
        run: npm ci

      # 4. Produce the production build. A build error fails the job.
      - name: Build production assets
        run: npm run build
